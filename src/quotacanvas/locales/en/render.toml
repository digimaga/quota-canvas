# Panel wording (render.py / status.py). Keep keys and {name} placeholders
# identical to ja/render.toml. English stays short: TURZX panels are narrow.

# default sentence separator (when display.separator is ""). Strings use " · "
separator = " · "

[weekday]
mon = "Mon"
tue = "Tue"
wed = "Wed"
thu = "Thu"
fri = "Fri"
sat = "Sat"
sun = "Sun"

[month]
jan = "Jan"
feb = "Feb"
mar = "Mar"
apr = "Apr"
may = "May"
jun = "Jun"
jul = "Jul"
aug = "Aug"
sep = "Sep"
oct = "Oct"
nov = "Nov"
dec = "Dec"

[date]
full = "{weekday}, {month} {day} {hour:02d}:{minute:02d}"
short = "{month} {day} {hour:02d}:{minute:02d}"

[badge]
over = "Over pace"
exhausted = "Limit hit"
tight = "Maxing out"
on_track = "On track"
spare = "Spare"
fresh = "Just reset"
unknown = "Pending"

[badge_short]
# sub-row status (short). "Just reset" is shown as "Spare" on sub rows
over = "Over"
exhausted = "Limit"
tight = "Maxing"
on_track = "OK"
spare = "Spare"
fresh = "Spare"
unknown = "N/A"

[word]
remaining = "left"
used = "used"

[gauge]
used_head = "used"
caption = "{head} {value}% / ideal {ideal}%"
exhausted = "Exhausted"

[span]
dh = "{d}d{h}h"
d = "{d}d"
hm = "{h}h{m}m"
h = "{h}h"
m = "{m}m"

[elapsed]
of = "{e} of {total} elapsed"
short = "{e} elapsed"

[credit]
no_expiry = "No expiry"
row = "until {dt} · {span} left"
count = "Reset credits ×{n}"
next = "· next {dt}"
more = "+{n} more"
head = "Reset credits ×{n} ({tz})"

[stale]
text = "Fetch failed"
at = "Fetch failed · {hh:02d}:{mm:02d}"

[error]
title = "Fetch error"
reason = "Fetch failed ({reason})"
unknown = "unknown"

[card]
exhaust_at = "Runs out {dt} (in {span})"
projected = "Est. {pct}% used by reset"
no_projection = "No projection"
reset_line = "Reset {dt} · {span} left"
no_reset = "Reset time unknown"
narrow_el_reset = " · resets in {span}"
reset_compact = "Resets in {span}"
prev_left = "Last: {pct}% left"
prev_used = "Last: {pct}% used"
sub_exhaust_at = "{label} window may run out by {dt}"
sub_exhausted = "{label} window is maxed out"

[advice]
no_data = "No data · measuring"
exhausted_reset = "Limit hit · resets in {span}"
fresh = "Just reset · the window is open"
fresh_compact = "Just reset · open"
burst = "At this pace, gone by {dt}"
burst_compact = "Gone by {dt} at this pace"
compact_reset = "resets in {span}"
# pacing.sleep advice = "bedtime": deadline is bedtime
bedtime_compact_reset = "until bed {span}"
compact_per_day = "up to {pct}%/day"
# windows shorter than a day show the rest and the time to the deadline
short_left = "{head} · {pct}% left · in {span}"
short_left_bedtime = "{head} · {pct}% left · until bed {span}"
no_reset = "{label} · reset time unknown"
slow_down = "Slow down"
slow_down_pct = "Slow down ~{pct}%"
slow_down_plan = "{head} · {rem}: {allowance}"
over_last_unit = "Slow down · {pct}% left in the final {span}"
bedtime_over_last_unit = "Slow down · {pct}% left in the {span} until bed"
over_generic = "Over pace · take it easy"
tight = "On pace to use it all"
tight_last_unit = "On pace to use it all · resets in {span}"
bedtime_tight_last_unit = "On pace to use it all · until bed {span}"
tight_plan = "On pace to use it all · {allowance}"
on_track_last_unit = "On track · resets in {span}, {pct}% unused"
bedtime_on_track_last_unit = "On track · until bed {span}, {pct}% unused"
on_track_plan = "On track · {allowance} pace works"
spare_last_unit = "Spare · resets in {span}, {pct}% unused"
bedtime_spare_last_unit = "Spare · until bed {span}, {pct}% unused"
spare_forecast = "about {pct}% will remain at this pace"
spare_plan = "Spare · up to {pct}%/{unit}"
unit_day = "day"
allowance = "{pct}%/{unit}"
rem_days = "{d}d left"
