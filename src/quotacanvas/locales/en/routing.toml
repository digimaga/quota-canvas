# Worker routing messages (gate.py / the routing CLI commands). The ja gate
# strings mirror the old ~/.claude/bin/quota-gate line format.
usage = "usage: quota-canvas routing line [--json] | quota-canvas routing check <worker> [--json] | quota-canvas routing burn [worker on|off [--until HH:MM|ISO]] | quota-canvas routing mode [NAME standard|burn|off] [--until HH:MM|ISO] [--json] | quota-canvas routing hook [--event NAME]"
state_error = "Unable to save routing state: {detail}"

[gate]
disabled = "monitor only"
line = "quota: {body} (as of {at})"
over = "pace over"
exhausts = " · ~{dt} projected to exhaust"
credits = "{n} reset credits"
credit_one = "{n} reset credit"
burn = "burn ~{dt}"
stale_missing = "quota: stale (no status.json)"
stale_old = "quota: stale (as of {time}, {reason})"
stale_reason_old = "too old to judge quota"
stale_reason_broken = "unreadable, not judging quota"

[check]
disabled = "quota-canvas: {name}=stop (monitor only; excluded from routing). Set QUOTA_GATE_FORCE=1 to ignore"
stop = "quota-canvas: {name}=stop ({detail}). Set QUOTA_GATE_FORCE=1 to ignore"
reserve = "quota-canvas: {name}=reserve ({detail}). Prefer other workers if possible"
unknown = "quota-canvas: {name}=unknown ({reason}). Cannot judge, continuing"
remains = "remaining {pct}"
remains_reset = "remaining {pct}, ~{dt}"

[burn]
none = "burn mode: none"
entry = "burn mode: {name} (until ~{dt})"
set = "{host}: burn mode {name} (until ~{dt})"
cleared = "{host}: burn mode {name} cleared"
bad_until = "--until takes HH:MM or an ISO 8601 time"

[hook]
# Rules `routing hook` appends to the quota line in additionalContext (read by
# the AI at session start, hence "the quota line above").
rules = """The quota line above is quota-canvas's per-AI-worker quota verdict. It never stops this session's own work — use it only when handing work to subagents or other AI workers. If the user names a worker, follow them.
- Prefer in this order: boost (headroom) > go (normal use) > reserve (pace is over; pick another worker if one fits). Do not assign new work to stop (used up or monitor only).
- =? / =stale mean the verdict is unavailable: ignore the numbers and choose as usual.
- The remaining percentages only rank the candidates; they never outrank task fit.
- Burn mode, QUOTA_GATE_FORCE, --force, and config changes only when the user asks.
- To see the latest verdict in the middle of a long task, run `quota-canvas routing line`."""
