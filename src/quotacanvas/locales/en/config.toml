# Config (config.py) error messages.
read_failed = "{path}: cannot read the config file ({detail})"
not_utf8 = "{path}: not valid UTF-8"
syntax_error = "{path}: TOML syntax error: {detail}"
not_object = "{source}: the config must be an object (JSON with \"display\" etc.; current: {value!r})"
need_table = "{path}: '{name}' must be a table ([{name}]; current: {value!r})"
range_min = "{lo:g} or more"
range_between = "{lo:g}-{hi:g}"
int_required = "{path}: '{name}' must be an integer {range} (current: {value!r})"
float_required = "{path}: '{name}' must be a number {range} (current: {value!r})"
bool_required = "{path}: '{name}' must be true or false (current: {value!r})"
list_required = "{path}: '{name}' must be an array of strings (e.g. {example})"
empty_string = "{path}: '{name}' cannot be an empty string"
choice_required = "{path}: '{name}' must be one of {choices} (current: {value!r})"
color_required = "{path}: '{name}' must be a \"#RRGGBB\" color (e.g. \"#D97757\"; current: {value!r})"
separator_required = "{path}: '{name}' must be a string of at most {max} characters (current: {value!r})"
time_required = "{path}: '{name}' must be an \"HH:MM\" time (current: {value!r})"
panels_not_array = "{path}: '{name}' must be an array of [[layout.panels]] (each a table of main / subs / size)"
too_many_columns = "{path}: '{name}' allows at most {max} columns (1 per large, 2 stacked smalls per column); now: {actual}"
panel_main_not_string = "{path}: '{name}' must be a window or service id string (e.g. main = \"claude:weekly\"; current: {value!r})"
panel_main_required = "{path}: '{name}.main' is required (e.g. main = \"claude:weekly\"; main = \"\" is only allowed with size = \"small\")"
sleep_same_time = "{path}: pacing.sleep start and end must differ (equal times would make the sleep band empty)"
sleep_time_required = "{path}: '{name}' is required (an \"HH:MM\" time; specify both start and end)"
workers_required = "{path}: 'routing.workers' must be a table of worker name → window id list (e.g. glm = [\"glm:5h\"], got: {value!r})"
workers_empty = "{path}: 'routing.workers.{name}' must not be an empty list (the worker would use no windows; remove it or list window ids)"
workers_bad_name = "{path}: invalid worker name '{name}' (use up to 40 ASCII letters, digits, '.', '_' or '-')"
workers_entry_required = "{path}: each element of the 'routing.workers' array must be an object with name and windows (index {index}; current: {value!r})"
workers_duplicate = "{path}: duplicate worker name '{name}'"
