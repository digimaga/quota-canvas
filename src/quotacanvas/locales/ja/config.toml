# 設定 (config.py) のエラーメッセージ。ja は現行の文言と一字一句同じ。
read_failed = "{path}: 設定ファイルを読み込めません ({detail})"
not_utf8 = "{path}: UTF-8 として読めません"
syntax_error = "{path}: TOML の構文エラー: {detail}"
not_object = "{source}: 設定はオブジェクト (\"display\" などの入った JSON) で送ってください（現在: {value!r}）"
need_table = "{path}: '{name}' はテーブル ([{name}]) として指定してください（現在: {value!r}）"
range_min = "{lo:g} 以上"
range_between = "{lo:g}〜{hi:g}"
int_required = "{path}: '{name}' は {range} の整数で指定してください（現在: {value!r}）"
float_required = "{path}: '{name}' は {range} の数値で指定してください（現在: {value!r}）"
bool_required = "{path}: '{name}' は true か false で指定してください（現在: {value!r}）"
list_required = "{path}: '{name}' は文字列の配列で指定してください（例: {example}）"
empty_string = "{path}: '{name}' に空の文字列は指定できません"
choice_required = "{path}: '{name}' は {choices} のいずれかで指定してください（現在: {value!r}）"
color_required = "{path}: '{name}' は \"#RRGGBB\" 形式の色で指定してください（例: \"#D97757\"、現在: {value!r}）"
separator_required = "{path}: '{name}' は {max} 文字以内の文字列で指定してください（現在: {value!r}）"
time_required = "{path}: '{name}' は \"HH:MM\" 形式の時刻で指定してください（現在: {value!r}）"
panels_not_array = "{path}: '{name}' は [[layout.panels]] の配列で指定してください（各要素は main / subs / size のテーブル）"
too_many_columns = "{path}: '{name}' の列は最大 {max} つです（large は 1 列、連続する small 2 枚で 1 列）、現在: {actual} 列"
panel_main_not_string = "{path}: '{name}' は窓 ID かサービス ID の文字列で指定してください（例: main = \"claude:weekly\"、現在: {value!r}）"
panel_main_required = "{path}: '{name}.main' は必須です（main = \"claude:weekly\" のように指定してください。main = \"\" の空き枠は size = \"small\" のときだけ使えます）"
sleep_same_time = "{path}: pacing.sleep の start と end は違う時刻にしてください（同じだと睡眠帯の長さが 0 になるため）"
sleep_time_required = "{path}: '{name}' は必須です（\"HH:MM\" 形式の時刻。start と end を両方指定してください）"
workers_required = "{path}: 'routing.workers' はワーカー名 → 窓 id 配列のテーブルで指定してください（例: glm = [\"glm:5h\"]、現在: {value!r}）"
workers_empty = "{path}: 'routing.workers.{name}' に空の配列は指定できません（どの窓も使わないワーカーになってしまうため。削除するか窓 id を書いてください）"
